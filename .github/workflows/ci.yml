name: Gen2 Clean UI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LÖVE
        shell: pwsh
        run: choco install love --yes --no-progress

      - name: Verify scaffold, core lock, and sandbox
        shell: pwsh
        env:
          GEN2_CLEAN_UI_HEADLESS: "1"
        run: .\tests\verify_scaffold.ps1
